<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B49"/>
      <stop offset="100%" stop-color="#07131D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#E59800"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#234668" stroke-width="4"/>

  <!-- Atomic Orbits (INB) -->
  <g transform="translate(256, 210)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="145" ry="52" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" transform="rotate(30)"/>
    <circle cx="120" cy="35" r="9" fill="#FFD15C" filter="url(#glow)"/>

    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="145" ry="52" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.85" transform="rotate(-30)"/>
    <circle cx="-120" cy="35" r="9" fill="#34D399" filter="url(#glow)"/>

    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="145" ry="52" fill="none" stroke="#60A5FA" stroke-width="4.5" opacity="0.75" transform="rotate(90)"/>
    <circle cx="0" cy="-145" r="8" fill="#93C5FD"/>

    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="22" fill="#002B49"/>
    
    <!-- Balance / Fiscal Glyph in Nucleus -->
    <path d="M-10 0 L10 0 M0 -10 L0 10 M-8 8 L-4 4 L0 8 M8 8 L4 4 L0 8" stroke="#FFD15C" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: INB -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    INB
  </text>

  <!-- Typography: GESTÃO FISCAL GEPAT.F -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="2">
    GESTÃO FISCAL GEPAT.F
  </text>
  
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    PLANEJAMENTO TRIBUTÁRIO
  </text>
</svg>
